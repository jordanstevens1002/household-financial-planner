name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  conventional-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Check Conventional Commit pull request title
        run: |
          python3 - <<'PY'
          import os
          import re

          title = os.environ["PR_TITLE"]
          pattern = re.compile(
              r"(feat|fix|docs|test|refactor|build|ci|chore|perf|revert)"
              r"(\([a-z0-9._/-]+\))?!?: .+"
          )
          if pattern.fullmatch(title) is None:
              raise SystemExit(
                  "Pull request title must use Conventional Commits, for example "
                  "'feat(loans): add repayment comparison'."
              )
          PY

  pr-size-guidance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report pull request size guidance
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          generated_paths = {
              "appsmith/household-financial-planner.json",
              "frontend/openapi.json",
              "frontend/package-lock.json",
              "frontend/src/api/schema.d.ts",
          }
          output = subprocess.check_output(
              ["git", "diff", "--numstat", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]],
              text=True,
          )
          reviewed = generated = 0
          for row in output.splitlines():
              additions, deletions, path = row.split("\t", 2)
              if additions == "-" or deletions == "-":
                  continue
              changed = int(additions) + int(deletions)
              if path in generated_paths or path.endswith(".lock"):
                  generated += changed
              else:
                  reviewed += changed

          summary = (
              f"Human-reviewed changed lines: {reviewed}\n"
              f"Generated or lock-file changed lines: {generated}\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("## Pull request size\n\n")
              stream.write(summary.replace("\n", "  \n"))

          print(summary, end="")
          if reviewed > 1500:
              print(
                  "::warning::This pull request exceeds 1,500 human-reviewed changed lines. "
                  "Split it or record explicit maintainer agreement."
              )
          elif reviewed > 750:
              print(
                  "::warning::This pull request exceeds the 750-line review guide. "
                  "Explain why it remains one cohesive change."
              )
          PY

  appsmith-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python3 appsmith/generate_app.py
      - run: git diff --exit-code -- appsmith/household-financial-planner.json
      - run: python3 -m unittest discover -s appsmith/tests -v

  api-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: household_finance_test
          POSTGRES_USER: household_finance
          POSTGRES_PASSWORD: test-only-password
        options: >-
          --health-cmd "pg_isready -U household_finance -d household_finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql+asyncpg://household_finance:test-only-password@localhost:5432/household_finance_test
      OIDC_ISSUER: https://identity.example.com/
      OIDC_AUDIENCE: household-financial-planner
      OIDC_JWKS_URL: https://identity.example.com/.well-known/jwks.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install ".[test]"
      - run: python scripts/export_openapi.py ../frontend/openapi.json
      - run: git diff --exit-code -- ../frontend/openapi.json
      - run: sh scripts/check.sh
      - run: alembic upgrade head
      - run: python scripts/check_local_account_migration.py
      - run: alembic check

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run contracts:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - run: npm run e2e

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build --target runtime --tag household-financial-planner-api:${{ github.sha }} ./api
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: household-financial-planner-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ".[test]" pip-audit
      - run: pip-audit
